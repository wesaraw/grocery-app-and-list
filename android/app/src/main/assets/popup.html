<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Grocery Price Checker</title>
  <style>
    body { font-family: Arial, sans-serif; width: 300px; }
    li { margin-bottom: 10px; }
    .item-row {
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .final-product-img {
      width: 50px;
      height: 50px;
      object-fit: contain;
      background: #ccc;
      vertical-align: middle;
      display: none;
      flex: 0 0 auto;
    }
    .item-row button {
      flex: 1 1 auto;
      text-align: left;
      padding: 4px 6px;
    }
    .item-row span {
      flex: 0 0 auto;
    }
    #header {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .category-header {
      border-top: 1px solid #ccc;
      margin-top: 10px;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .category-header-title {
      flex: 1 1 auto;
    }
    .order-cap-input {
      width: 72px;
      flex: 0 0 auto;
      padding: 2px 4px;
    }
    .category-cap-input {
      font-weight: normal;
    }
    .item-cap-input {
      width: 64px;
    }
  </style>
</head>
<body>
  <div id="header">
    <h1>Grocery Items</h1>
    <label>Search: <input id="searchBox" type="text" placeholder="Search"></label>
    <div>
      <button id="commit">Comit</button>
      <button id="editInventory">Edit Inventory</button>
      <button id="editConsumption">Edit Consumption</button>
      <button id="editPlan">Edit Consumption Plan</button>
      <button id="addItem">Add Item</button>
      <button id="removeItem">Remove Item</button>
      <button id="editCategory">Edit Category</button>
      <button id="editExpirations">Edit Expiration Dates</button>
      <button id="couponBtn">Coupons</button>
      <button id="backupBtn">💾</button>
      <button id="uomChange">UOM Change</button>
      <button id="densityRatios">Volume:Weight ratios</button>
      <button id="mealMultiplier">Meal Multiplier</button>
      <button id="cookingDays">Cooking Days</button>
      <button id="mealChooser">Meal Chooser</button>
      <button id="storeTotals">Store Totals</button>
      <button id="viewCalendar">Calendar</button>
      <button id="toggleZero">Hide Zero Qty</button>
    </div>
  </div>
  <ul id="items"></ul>
  <script src="bridge.js"></script>
<script type="module" src="popup.js"></script>
</body>
</html>
