<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Meal List</title>
  <style>
      body { font-family: Arial, sans-serif; }
      table { width: 100%; border-collapse: collapse; }
      th, td { border: 1px solid #ccc; padding: 4px; font-size: 12px; vertical-align: top; }
      .meal-img {
        width: 160px;
        height: 160px;
        object-fit: contain;
        background: #ccc;
        margin-right: 4px;
        vertical-align: middle;
      }
      .meal-instructions-btn {
        display: inline-block;
        font-size: 11px;
        margin-top: 4px;
        padding: 2px 6px;
      }
      .meal-instructions-btn--empty {
        opacity: 0.8;
        font-style: italic;
      }
      .meal-nutrition-scores {
        display: flex;
        flex-wrap: wrap;
        gap: 4px 8px;
        margin-top: 4px;
        font-size: 11px;
      }
      .meal-nutrition-score {
        display: inline-flex;
        flex-direction: column;
        align-items: flex-start;
        gap: 2px;
        padding: 2px 6px;
        border-radius: 4px;
        border: 1px solid #e0e0e0;
        background: #f7f7f7;
      }
      .meal-nutrition-score__header {
        display: flex;
        align-items: baseline;
        justify-content: space-between;
        gap: 4px;
        width: 100%;
      }
      .meal-nutrition-score__label {
        font-weight: 600;
      }
      .meal-nutrition-score__value {
        color: #333;
      }
      .meal-nutrition-score__upper-limit {
        font-size: 10px;
        color: #2e7d32;
      }
      .portion-input {
        width: 52px;
        margin-left: 4px;
        padding: 2px;
        font-size: 11px;
      }
      .use-cell-content {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
        gap: 4px 8px;
        align-items: center;
      }
      .use-cell-content label {
        display: inline-flex;
        align-items: center;
        gap: 4px;
      }
      th:nth-child(3), td:nth-child(3) { width: 200px; }
      th.book-header {
        border-top: 1px solid #ccc;
        text-align: left;
        position: sticky;
        background: #fff;
        z-index: 1;
        cursor: pointer;
      }
      .visibility-toggle {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        font-size: 14px;
        margin: 4px 0 8px;
      }
      .visibility-toggle input[type="checkbox"] {
        width: 16px;
        height: 16px;
      }
      tr.focused-meal td,
      tr.focused-meal th {
        background-color: #fff4b2;
        transition: background-color 0.6s ease;
      }
  </style>
</head>
<body>
  <h1 id="title"></h1>
  <label class="visibility-toggle">
    <input type="checkbox" id="displayOnWhatToCook" checked>
    Display on What To Cook
  </label>
  <button id="addMeal">Add Meal</button>
  <button id="removeMeal">Remove Meal</button>
  <button id="repairMealIds">Correct meal id errors</button>
  <table>
    <thead>
      <tr>
        <th>Use</th>
        <th>Image</th>
        <th>Meal</th>
        <th>Prep</th>
        <th>Leftovers</th>
        <th>Weight</th>
        <th>Portions</th>
        <th>Group</th>
        <th>Ingredient</th>
        <th>Prep Item</th>
        <th>Amount</th>
        <th>Cost</th>
        <th>Total</th>
        <th></th>
      </tr>
    </thead>
    <tbody id="mealBody"></tbody>
  </table>
  <script type="module" src="mealListView.js"></script>
</body>
</html>
