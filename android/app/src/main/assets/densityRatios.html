<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Volume:Weight Ratios</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      width: 100%;
      max-width: 900px;
      margin: 0 auto;
    }
    table { width: 100%; border-collapse: collapse; }
    td, th { padding: 4px; border-bottom: 1px solid #ccc; }
    input[type="text"],
    input[type="number"] { width: 70px; }
    select { min-width: 90px; }
    .hidden { display: none; }
    .category-header {
      border-top: 1px solid #ccc;
      text-align: left;
      cursor: pointer;
    }
    .normalized-cell {
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .normalized-cell select {
      flex: 1;
    }
  </style>
</head>
<body>
  <h1>Volume:Weight Ratios</h1>
  <label>Search: <input id="searchBox" type="text" placeholder="Search"></label>
  <table>
    <thead>
      <tr>
        <th>Item</th>
        <th>Ratio</th>
        <th>1 cup weight (g)</th>
        <th>Convert?</th>
        <th>From (unit & amount)</th>
        <th>To (unit & amount)</th>
        <th>Save</th>
      </tr>
    </thead>
    <tbody id="ratio-list"></tbody>
  </table>
  <script src="bridge.js"></script>
<script type="module" src="densityRatios.js"></script>
</body>
</html>
