<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Confirm Nutrition Match</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 16px;
      width: 520px;
    }
    h1 {
      margin-top: 0;
    }
    #itemName {
      font-weight: bold;
      margin-bottom: 12px;
    }
    #searchForm {
      display: flex;
      flex-direction: column;
      gap: 8px;
      margin-bottom: 10px;
    }
    .search-row {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .search-row input {
      flex: 1;
      padding: 6px 8px;
      font-size: 0.95em;
    }
    .search-row button {
      padding: 6px 14px;
      font-size: 0.95em;
    }
    .brand-row {
      align-items: center;
    }
    .brand-row label {
      font-weight: 600;
      font-size: 0.9em;
      color: #333;
    }
    .brand-row input {
      flex: 1;
    }
    .helper-text {
      margin: 0;
      font-size: 0.85em;
      color: #555;
    }
    .spinner {
      font-size: 0.85em;
      color: #555;
    }
    .candidate {
      display: flex;
      align-items: flex-start;
      gap: 10px;
      border: 1px solid #ccc;
      border-radius: 4px;
      padding: 10px;
      margin-bottom: 8px;
    }
    .candidate input {
      margin-top: 4px;
    }
    .candidate-body {
      flex: 1;
    }
    .candidate header {
      font-weight: bold;
      margin: 0 0 6px;
    }
    .candidate small {
      color: #555;
      display: block;
    }
    .score {
      font-size: 0.85em;
      color: #0b5394;
    }
    .actions {
      display: flex;
      justify-content: flex-end;
      align-items: center;
      gap: 8px;
      margin-top: 12px;
      flex-wrap: wrap;
    }
    .primary-actions {
      display: flex;
      gap: 8px;
    }
    #markNotFoodBtn {
      margin-right: auto;
    }
    .status {
      margin-top: 10px;
      font-size: 0.9em;
    }
    .status.error {
      color: #a40000;
    }
    .status.success {
      color: #0b7a0b;
    }
    .status.warning {
      color: #9c5700;
    }
    .search-status {
      margin-bottom: 12px;
    }
  </style>
</head>
<body>
  <h1>Confirm Nutrition Match</h1>
  <div id="itemName"></div>
  <form id="searchForm">
    <div class="search-row">
      <input id="searchInput" type="text" placeholder="Search USDA foods" aria-label="Search USDA foods">
      <button id="searchBtn" type="submit">Search</button>
      <span id="searchSpinner" class="spinner" hidden>Searching…</span>
    </div>
    <div class="search-row brand-row">
      <label for="brandInput">Brand name</label>
      <input id="brandInput" type="text" placeholder="Optional brand name" aria-label="Search Branded foods by brand name">
    </div>
    <p class="helper-text">Adding a brand name will search the USDA Branded foods dataset using the brandName field.</p>
  </form>
  <div id="searchStatus" class="status search-status"></div>
  <div id="candidates"></div>
  <div class="actions">
    <button id="markNotFoodBtn" type="button">Mark as Not Food</button>
    <div class="primary-actions">
      <button id="confirmBtn" disabled>Confirm Selection</button>
      <button id="skipBtn" type="button">Skip</button>
    </div>
  </div>
  <div id="status" class="status"></div>
  <script type="module" src="nutritionConfirm.js"></script>
</body>
</html>
