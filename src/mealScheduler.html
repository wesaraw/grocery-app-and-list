<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Meal Scheduler</title>
  <style>
    :root {
      font-family: Arial, sans-serif;
      color: #1f2430;
      background: #f3f4f8;
    }

    body {
      margin: 0;
      padding: 20px;
      background: inherit;
    }

    h1 {
      margin: 0 0 12px;
      font-size: 24px;
      font-weight: 600;
    }

    .help-text {
      margin: 6px 0 18px;
      color: #4a5166;
      font-size: 14px;
    }

    .controls {
      display: flex;
      gap: 16px;
      flex-wrap: wrap;
      align-items: flex-end;
      margin-bottom: 16px;
    }

    .control-group {
      display: flex;
      flex-direction: column;
      gap: 6px;
      font-size: 14px;
    }

    select,
    input[type="number"] {
      padding: 6px 10px;
      border-radius: 6px;
      border: 1px solid #c7c9d3;
      font-size: 14px;
      background: #fff;
      min-width: 160px;
    }

    input[type="number"] {
      width: 100px;
    }

    #statusMessage {
      min-height: 20px;
      margin-bottom: 12px;
      font-size: 13px;
      color: #555e72;
    }

    .layout {
      display: flex;
      flex-wrap: wrap;
      gap: 20px;
    }

    .slot-column {
      flex: 2 1 420px;
      min-width: 360px;
      background: #fff;
      border-radius: 10px;
      border: 1px solid #d9dce7;
      padding: 16px;
      max-height: 70vh;
      overflow-y: auto;
      box-shadow: 0 1px 3px rgba(31, 36, 48, 0.1);
    }

    .picker-column {
      flex: 1 1 280px;
      min-width: 260px;
      background: #fff;
      border-radius: 10px;
      border: 1px solid #d9dce7;
      padding: 16px;
      box-shadow: 0 1px 3px rgba(31, 36, 48, 0.1);
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .day-section {
      margin-bottom: 18px;
    }

    .day-section h2 {
      margin: 0 0 8px;
      font-size: 16px;
      color: #2f3a5c;
      border-bottom: 1px solid #eceff6;
      padding-bottom: 4px;
    }

    .slot-list {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .slot-btn {
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      gap: 4px;
      padding: 10px 12px;
      border-radius: 8px;
      border: 1px solid #cbd3eb;
      background: #f8faff;
      font-size: 13px;
      cursor: pointer;
      transition: background 0.2s ease, border 0.2s ease;
      text-align: left;
    }

    .slot-btn:hover {
      background: #eef4ff;
      border-color: #9fb5f6;
    }

    .slot-btn[data-selected="true"] {
      border-color: #4c6ef5;
      background: #e5edff;
      box-shadow: inset 0 0 0 1px #4c6ef5;
    }

    .slot-btn .slot-label {
      font-weight: 600;
      color: #1f285e;
    }

    .slot-btn .slot-meal {
      font-size: 12px;
      color: #4a5166;
    }

    .slot-btn[data-changed="true"] .slot-meal {
      color: #0a684f;
      font-weight: 600;
    }

    .picker-column h2 {
      margin: 0;
      font-size: 18px;
    }

    #selectedSlotLabel {
      min-height: 20px;
      font-size: 14px;
      color: #2f3a5c;
    }

    .meal-options {
      display: flex;
      flex-direction: column;
      gap: 8px;
      overflow-y: auto;
      max-height: 45vh;
      padding-right: 4px;
    }

    .meal-btn {
      padding: 8px 10px;
      border-radius: 6px;
      border: 1px solid #d0d5e6;
      background: #fafbff;
      font-size: 13px;
      text-align: left;
      cursor: pointer;
      transition: background 0.2s ease, border 0.2s ease;
    }

    .meal-btn:hover {
      background: #eef2ff;
      border-color: #9fb5f6;
    }

    .meal-btn[data-selected="true"] {
      border-color: #4c6ef5;
      background: #e5edff;
      font-weight: 600;
    }

    #clearSelectionBtn {
      align-self: flex-start;
      padding: 6px 12px;
      border-radius: 6px;
      border: 1px solid #d0d5e6;
      background: #fff9f1;
      color: #8a4b10;
      cursor: pointer;
      font-size: 13px;
      display: none;
    }

    #clearSelectionBtn[data-visible="true"] {
      display: inline-flex;
    }

    .actions {
      display: flex;
      gap: 12px;
      align-items: center;
      flex-wrap: wrap;
      margin-top: 20px;
    }

    #saveBtn {
      padding: 10px 20px;
      border-radius: 8px;
      border: none;
      background: #2f6feb;
      color: #fff;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s ease;
      display: none;
    }

    #saveBtn[data-visible="true"] {
      display: inline-flex;
    }

    #saveBtn:disabled {
      opacity: 0.6;
      cursor: default;
    }

    #copyAllBtn,
    #copyWeekBtn {
      padding: 10px 18px;
      border-radius: 8px;
      border: 1px solid #cbd3eb;
      background: #f8faff;
      color: #2f3a5c;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s ease, border 0.2s ease;
    }

    #copyAllBtn:hover:not(:disabled),
    #copyWeekBtn:hover:not(:disabled) {
      background: #eef4ff;
      border-color: #9fb5f6;
    }

    #copyAllBtn:disabled,
    #copyWeekBtn:disabled {
      opacity: 0.6;
      cursor: default;
    }

    .copy-week-controls {
      display: none;
      align-items: center;
      gap: 8px;
    }

    .copy-week-controls[data-visible="true"] {
      display: flex;
    }

    #copyWeekSelect {
      min-width: 120px;
    }

    #copyWeekSaveBtn {
      padding: 8px 16px;
      border-radius: 6px;
      border: 1px solid #2f6feb;
      background: #2f6feb;
      color: #fff;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s ease;
    }

    #copyWeekSaveBtn:disabled {
      opacity: 0.6;
      cursor: default;
    }

    .empty-state {
      font-size: 13px;
      color: #6b7280;
      padding: 12px 0;
    }
  </style>
</head>
<body>
  <h1>Meal Scheduler</h1>
  <p class="help-text">
    Assign meals to specific calendar slots for a single week. Overrides apply only to the selected week.
  </p>
  <div class="controls">
    <div class="control-group">
      <label for="userSelect">User</label>
      <select id="userSelect"></select>
    </div>
    <div class="control-group">
      <label for="yearInput">Year</label>
      <input id="yearInput" type="number" min="2000" max="2100" step="1">
    </div>
    <div class="control-group">
      <label for="weekInput">Week</label>
      <input id="weekInput" type="number" min="1" max="53" step="1">
    </div>
  </div>
  <div id="statusMessage" role="status" aria-live="polite"></div>
  <div class="layout">
    <div class="slot-column" id="slotColumn">
      <div class="empty-state" id="slotEmptyState">Select a user to load their meal slots.</div>
    </div>
    <div class="picker-column">
      <h2>Meal Picker</h2>
      <div id="selectedSlotLabel">Select a slot to choose a meal.</div>
      <button id="clearSelectionBtn" type="button">Clear selection</button>
      <div class="meal-options" id="mealOptions"></div>
    </div>
  </div>
  <div class="actions">
    <button id="saveBtn" type="button">Save Changes</button>
    <button id="copyAllBtn" type="button">Copy to all users</button>
    <button id="copyWeekBtn" type="button" aria-haspopup="true" aria-expanded="false">Copy to Week...</button>
    <div class="copy-week-controls" id="copyWeekControls" data-visible="false">
      <select id="copyWeekSelect" aria-label="Select week to copy to"></select>
      <button id="copyWeekSaveBtn" type="button">Save</button>
    </div>
  </div>
  <script type="module" src="mealScheduler.js"></script>
</body>
</html>
