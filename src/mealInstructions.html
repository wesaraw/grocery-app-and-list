<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Meal Instructions</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 16px;
      max-width: 720px;
    }
    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      margin-bottom: 16px;
    }
    #mealTitle {
      font-size: 20px;
      margin: 0;
      flex: 1;
      word-break: break-word;
    }
    #toggleEdit {
      padding: 6px 12px;
      font-size: 14px;
    }
    #statusMessage {
      font-size: 12px;
      color: #2c662d;
      min-height: 16px;
    }
    #instructionsView {
      margin: 0;
      padding-left: 20px;
    }
    #instructionsView li {
      margin-bottom: 8px;
      line-height: 1.4;
      white-space: pre-line;
    }
    #instructionsEdit {
      width: 100%;
      min-height: 220px;
      font-family: inherit;
      font-size: 14px;
      padding: 8px;
      box-sizing: border-box;
      display: none;
    }
    .empty-message {
      font-style: italic;
      color: #555;
      margin-top: 8px;
    }
    .hidden {
      display: none !important;
    }
  </style>
</head>
<body>
  <header>
    <h1 id="mealTitle">Meal Instructions</h1>
    <button id="toggleEdit" type="button" disabled>Edit</button>
  </header>
  <div id="statusMessage" role="status" aria-live="polite"></div>
  <ol id="instructionsView"></ol>
  <p id="emptyMessage" class="empty-message hidden">No instructions recorded yet.</p>
  <textarea id="instructionsEdit" aria-label="Meal instructions editor"></textarea>
  <script type="module" src="mealInstructions.js"></script>
</body>
</html>
