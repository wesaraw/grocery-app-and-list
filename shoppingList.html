<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Shopping List</title>
  <style>
    body { font-family: Arial, sans-serif; width: 300px; }
    h2 { margin-top: 20px; }
    ul { padding-left: 20px; }
    li { margin-bottom: 10px; display: flex; align-items: center; }
    li img { width: 50px; height: 50px; object-fit: contain; background: #ccc; margin-right: 5px; }
    .controls { display: flex; flex-direction: column; gap: 8px; margin-bottom: 12px; }
    .prep-controls { display: flex; flex-direction: column; align-items: flex-start; gap: 4px; }
    .prep-window-summary { font-size: 0.85em; color: #555; }
    .empty-message { display: none; color: #666; font-style: italic; margin-top: 12px; }
  </style>
</head>
<body>
  <h1>Shopping List</h1>
  <div class="controls">
    <label>Search: <input id="searchBox" type="text" placeholder="Search"></label>
    <div class="prep-controls">
      <label><input id="prepWindowToggle" type="checkbox" disabled> Prep window only</label>
      <div id="prepWindowSummary" class="prep-window-summary">Prep window: --</div>
    </div>
  </div>
  <div id="list"></div>
  <p id="prepEmptyMessage" class="empty-message">No items match the current filters.</p>
  <button id="confirmAdd">Confirm Add</button>
  <script type="module" src="shoppingList.js"></script>
</body>
</html>
