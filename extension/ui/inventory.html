<!DOCTYPE html>
<html>
  <head>
    <title>Edit Inventory</title>
    <style>
      .stock-input,
      .pack-input {
        width: 4em;
      }
    </style>
  </head>
  <body>
    <h1>Edit Inventory</h1>
    <label>Search: <input id="searchBox" type="text" placeholder="Search"></label>
    <button id="toggleZero">Hide Zero Qty</button>
    <button id="addItem">Add Item</button>
    <button id="removeItem">Remove Item</button>
    <button id="renameItem">Rename Item</button>
    <button id="uomChange">Change UOM</button>
    <button id="densityRatios">Density Ratios</button>
    <button id="editCategory">Edit Category</button>
    <button id="editExpiration">Edit Expiration</button>
    <button id="editSeason">Edit Seasons</button>
    <button id="mealListPage">Meals</button>
    <button id="usersPage">Users</button>
    <button id="cookingDaysPage">Cooking Days</button>
    <button id="timelinePage">Timeline</button>
    <button id="backupPage">Backup</button>
    <label>Week:
      <input type="number" id="week-number" min="1" max="52" value="1">
    </label>
    <div id="controls">
      <label>Item:
        <input type="text" id="purchase-item" list="item-list">
        <datalist id="item-list"></datalist>
      </label>
      <label>Week:
        <input type="number" id="purchase-week" min="1" max="52">
      </label>
      <label>Qty:
        <input type="number" id="purchase-qty">
      </label>
      <button id="add-purchase">Add Purchase</button>
    </div>
    <button id="toggle-history">Purchase History</button>
    <div id="inventory"></div>
    <script type="module" src="inventory.js"></script>
  </body>
</html>
