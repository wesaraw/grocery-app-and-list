<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>API Keys</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 16px;
      width: 320px;
    }
    label {
      display: block;
      font-weight: bold;
      margin-bottom: 6px;
    }
    input[type="text"] {
      width: 100%;
      padding: 6px;
      font-size: 14px;
      box-sizing: border-box;
    }
    .actions {
      margin-top: 12px;
      display: flex;
      gap: 8px;
      justify-content: flex-end;
    }
    .status {
      margin-top: 8px;
      font-size: 0.9em;
    }
    .status.success {
      color: #0b7a0b;
    }
    .status.info {
      color: #0b5394;
    }
    .status.error {
      color: #a40000;
    }
  </style>
</head>
<body>
  <h1>API Keys</h1>
  <label for="fdcKey">FDC website API:</label>
  <input type="text" id="fdcKey" placeholder="Enter your USDA FDC API key" autocomplete="off" />
  <div class="status" id="status"></div>
  <div class="actions">
    <button id="saveBtn">Save</button>
    <button id="closeBtn">Close</button>
  </div>
  <script type="module" src="apiKeys.js"></script>
</body>
</html>
