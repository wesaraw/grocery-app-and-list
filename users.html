<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <link rel="stylesheet" href="styles/windowBase.css">
  <title>Users</title>
  <style>
    button { width: 100%; margin: 5px 0; }
    #portionMultiplierContainer { margin-top: 10px; display: none; }
    #portionMultiplierContainer.active { display: block; }
    #portionMultiplierContainer label { display: block; font-weight: bold; margin-bottom: 4px; }
    #portionMultiplierContainer input[type="number"] {
      width: 100%;
      box-sizing: border-box;
      padding: 4px 6px;
    }
    #mealList {
      margin-top: 10px;
      list-style: none;
      padding-left: 0;
    }
    .category-header {
      border-top: 1px solid #ccc;
      margin-top: 10px;
      cursor: pointer;
    }
    .slot-section {
      padding: 6px 0 2px;
    }
    .slot-days {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
    }
    .slot-days-label {
      font-weight: bold;
    }
    .slot-day-options {
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
    }
    .slot-day-option {
      display: flex;
      align-items: center;
      gap: 2px;
      font-size: 12px;
    }
    .slot-save {
      width: auto;
      margin: 0 0 0 auto;
      padding: 4px 8px;
    }
    .category-meals {
      margin: 6px 0 12px 20px;
      padding-left: 16px;
      list-style: disc;
    }
    .hidden { display: none; }
  </style>
</head>
<body>
  <h1>Users</h1>
  <div id="userButtons"></div>
  <button id="mealSlotOverrideBtn">Meal Slot Override</button>
  <button id="editNamesBtn">Edit User Names</button>
  <button id="saveNamesBtn" style="display:none;">Save</button>
  <div id="portionMultiplierContainer"></div>
  <ul id="mealList"></ul>
  <script type="module" src="users.js"></script>
</body>
</html>
