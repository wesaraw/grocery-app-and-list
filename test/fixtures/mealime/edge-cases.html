    <h1>Edge Case Lentil Soup</h1>
    <div>1 hr | 2-3 servings</div>
    <h2>Grab ingredients</h2>
    <ul>
      <li>¾ cup red lentils</li>
      <li>1 1/2 medium carrots</li>
      <li>Pinch salt</li>
    </ul>
    <h2>Cook & enjoy</h2>
    <p>Simmer ingredients together until tender.</p>
