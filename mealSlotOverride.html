<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Meal Slot Override</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 10px;
      background: #fafafa;
      color: #222;
      min-width: 780px;
    }

    h1 {
      margin-top: 0;
    }

    p.help-text {
      color: #555;
      font-size: 14px;
      margin-bottom: 12px;
    }

    #gridScroll {
      overflow-x: auto;
      border: 1px solid #ddd;
      border-radius: 6px;
      background: #fff;
      max-height: 420px;
    }

    table.override-grid {
      width: 100%;
      border-collapse: collapse;
      min-width: 620px;
    }

    table.override-grid th,
    table.override-grid td {
      border: 1px solid #e0e0e0;
      padding: 8px;
      vertical-align: top;
    }

    table.override-grid th {
      background: #f3f6ff;
      font-weight: 600;
      text-align: left;
      font-size: 13px;
    }

    table.override-grid td.user-cell {
      font-weight: 600;
      font-size: 14px;
      min-width: 150px;
      background: #f9fbff;
    }

    .slot-header {
      display: flex;
      flex-direction: column;
      gap: 4px;
      font-size: 12px;
    }

    .slot-header .role {
      font-weight: 600;
    }

    .grid-cell {
      display: flex;
      flex-direction: column;
      gap: 6px;
      min-width: 190px;
    }

    .grid-cell.editing {
      outline: 2px solid #ffa154;
      outline-offset: 2px;
      background: #fff6ed;
    }

    .chip-row {
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
    }

    .chip {
      border-radius: 16px;
      border: 1px solid #b8c2e0;
      background: #eef2ff;
      color: #1f285e;
      padding: 4px 12px;
      font-size: 12px;
      line-height: 1.3;
      cursor: pointer;
      transition: background 0.2s ease;
    }

    .chip:hover {
      background: #d9e2ff;
    }

    .chip.type-chip {
      border-color: #cba07a;
      background: #fff3e5;
      color: #5e341a;
    }

    .chip.type-chip[data-changed="true"] {
      border-color: #ff914d;
      background: #ffe0c7;
      color: #4a2c12;
      font-weight: 600;
    }

    .day-checkboxes {
      display: flex;
      flex-wrap: wrap;
      gap: 4px;
    }

    .day-option {
      display: flex;
      align-items: center;
      gap: 3px;
      padding: 2px 6px;
      border-radius: 4px;
      background: #f5f5f5;
      font-size: 11px;
    }

    .day-option input {
      margin: 0;
    }

    .apply-btn {
      align-self: flex-start;
      padding: 4px 12px;
      border-radius: 4px;
      border: none;
      background: #2f6feb;
      color: #fff;
      font-size: 12px;
      cursor: pointer;
      transition: background 0.2s ease;
    }

    .apply-btn:hover {
      background: #2156b8;
    }

    .apply-btn.hidden {
      display: none;
    }

    .picker-overlay {
      position: absolute;
      background: #ffffff;
      border: 1px solid #cfd6e6;
      border-radius: 6px;
      box-shadow: 0 8px 24px rgba(15, 23, 42, 0.18);
      padding: 4px;
      z-index: 10000;
      min-width: 180px;
    }

    .picker-overlay button {
      display: block;
      width: 100%;
      text-align: left;
      background: none;
      border: none;
      padding: 6px 8px;
      font-size: 13px;
      border-radius: 4px;
      cursor: pointer;
    }

    .picker-overlay button:hover,
    .picker-overlay button:focus {
      background: #eef3ff;
      outline: none;
    }

    .picker-overlay button[data-selected="true"] {
      background: #dde6ff;
      font-weight: 600;
    }

    .override-summary {
      margin-top: 24px;
    }

    .override-summary h2 {
      margin-bottom: 8px;
      font-size: 18px;
    }

    .override-summary table {
      width: 100%;
      border-collapse: collapse;
      background: #fff;
      border: 1px solid #e0e0e0;
    }

    .override-summary th,
    .override-summary td {
      border: 1px solid #e0e0e0;
      padding: 8px;
      font-size: 13px;
      vertical-align: top;
    }

    .override-summary th {
      background: #f3f6ff;
      text-align: left;
    }

    .override-summary .actions {
      display: flex;
      gap: 6px;
    }

    .override-summary .actions button {
      padding: 4px 8px;
      border-radius: 4px;
      border: 1px solid #c3cad9;
      background: #fff;
      cursor: pointer;
      font-size: 12px;
    }

    .override-summary .actions button:hover {
      background: #f0f4ff;
    }

    .no-data {
      font-style: italic;
      color: #666;
      margin-top: 4px;
    }
  </style>
</head>
<body>
  <h1>Meal Slot Override</h1>
  <p class="help-text">Choose a meal slot for each person, pick the replacement meal type, select the days it applies to, then click Apply to save the override.</p>
  <div id="gridScroll">
    <table class="override-grid" id="overrideGrid"></table>
  </div>
  <div class="override-summary" id="overrideSummary">
    <h2>Saved Overrides</h2>
  </div>
  <script type="module" src="mealSlotOverride.js"></script>
</body>
</html>
