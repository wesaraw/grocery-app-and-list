<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Confirm Nutrition Match</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 16px;
      width: 520px;
    }
    h1 {
      margin-top: 0;
    }
    #itemName {
      font-weight: bold;
      margin-bottom: 12px;
    }
    .candidate {
      border: 1px solid #ccc;
      border-radius: 4px;
      padding: 10px;
      margin-bottom: 8px;
    }
    .candidate header {
      font-weight: bold;
      margin-bottom: 6px;
    }
    .candidate small {
      color: #555;
      display: block;
    }
    .score {
      font-size: 0.85em;
      color: #0b5394;
    }
    .actions {
      display: flex;
      justify-content: flex-end;
      gap: 8px;
      margin-top: 12px;
    }
    .status {
      margin-top: 10px;
      font-size: 0.9em;
    }
    .status.error {
      color: #a40000;
    }
    .status.success {
      color: #0b7a0b;
    }
    .status.warning {
      color: #9c5700;
    }
  </style>
</head>
<body>
  <h1>Confirm Nutrition Match</h1>
  <div id="itemName"></div>
  <div id="candidates"></div>
  <div class="actions">
    <button id="confirmBtn" disabled>Confirm Selection</button>
    <button id="skipBtn">Skip</button>
  </div>
  <div id="status" class="status"></div>
  <script type="module" src="nutritionConfirm.js"></script>
</body>
</html>
