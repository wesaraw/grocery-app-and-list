<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>What To Cook</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      max-width: 1100px;
      margin: 0 auto;
      padding: 18px 24px 32px;
      box-sizing: border-box;
      color: #0f172a;
      background: #f9fafb;
    }

    h1 {
      margin: 0 0 10px;
    }

    .controls {
      display: flex;
      flex-wrap: wrap;
      gap: 10px 14px;
      align-items: flex-end;
      margin-bottom: 16px;
    }

    .controls label {
      display: flex;
      flex-direction: column;
      font-size: 0.9rem;
      gap: 4px;
    }

    .button-row {
      display: flex;
      gap: 10px;
    }

    button {
      border-radius: 6px;
      border: 1px solid #cbd5e1;
      background: #e2e8f0;
      color: #0f172a;
      padding: 8px 12px;
      cursor: pointer;
    }

    button:hover {
      background: #cbd5e1;
    }

    .page-description {
      margin: 0 0 12px;
      color: #475569;
    }

    .plan-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
      gap: 14px;
    }

    .day-card {
      background: #ffffff;
      border: 1px solid #dbe4f1;
      border-radius: 10px;
      padding: 14px 16px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      box-shadow: 0 1px 2px rgba(0, 0, 0, 0.04);
      page-break-inside: avoid;
    }

    .day-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
    }

    .day-title {
      font-size: 1.1rem;
      font-weight: 700;
      color: #0f172a;
    }

    .day-label {
      padding: 4px 8px;
      background: #eef2ff;
      color: #312e81;
      border: 1px solid #c7d2fe;
      border-radius: 999px;
      font-size: 0.85rem;
    }

    .day-content {
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .meal-section {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .meal-section h3 {
      margin: 0;
      font-size: 0.95rem;
      color: #1f2937;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .section-chip {
      background: #ecfeff;
      color: #0f172a;
      border: 1px solid #bae6fd;
      border-radius: 8px;
      padding: 4px 8px;
      font-size: 0.8rem;
    }

    .meal-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
      gap: 12px;
    }

    .meal-block {
      background: #f8fafc;
      border: 1px solid #dbe4f1;
      border-radius: 8px;
      padding: 10px 12px;
      display: flex;
      flex-direction: column;
      gap: 8px;
      height: 100%;
      break-inside: avoid;
      page-break-inside: avoid;
    }

    .meal-block-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
    }

    .meal-title {
      font-weight: 600;
      margin-bottom: 2px;
      color: #111827;
    }

    .meal-instructions-btn {
      font-size: 0.75rem;
      padding: 4px 8px;
      border-radius: 4px;
      border: 1px solid #cbd5f5;
      background: #e0e7ff;
      color: #1e3a8a;
      cursor: pointer;
    }

    .meal-instructions-btn:hover {
      background: #c7d2fe;
    }

    .meal-instructions-btn--empty {
      font-style: italic;
      opacity: 0.85;
    }

    .leftover-detail {
      font-size: 0.85rem;
      color: #4b5563;
    }

    .meal-part-label {
      font-size: 0.85rem;
      font-weight: 600;
      color: #1f2937;
    }

    .ingredient-list {
      margin: 4px 0 0;
      padding: 0;
      list-style: none;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .ingredient-entry {
      background: #ffffff;
      border: 1px solid #e2e8f0;
      border-radius: 6px;
      padding: 6px 8px;
      display: flex;
      flex-direction: column;
      gap: 6px;
      break-inside: avoid;
      page-break-inside: avoid;
    }

    .ingredient-header {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      gap: 12px;
      flex-wrap: wrap;
    }

    .ingredient-name {
      font-weight: 600;
      color: #1f2937;
    }

    .ingredient-amount {
      font-weight: 500;
      color: #0f172a;
      font-variant-numeric: tabular-nums;
      text-align: right;
    }

    .user-breakdown {
      margin: 0;
      padding: 0;
      list-style: none;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .user-breakdown-item {
      display: flex;
      justify-content: space-between;
      gap: 10px;
      font-size: 0.85rem;
      color: #334155;
    }

    .user-name {
      font-weight: 500;
    }

    .user-amount {
      font-variant-numeric: tabular-nums;
      text-align: right;
    }

    .no-ingredients,
    .empty-group {
      font-size: 0.9rem;
      color: #64748b;
    }

    @media print {
      body {
        max-width: none;
        padding: 12px 16px;
        background: #ffffff;
      }

      .controls,
      #printBtn,
      .button-row {
        display: none !important;
      }

      .plan-grid {
        grid-template-columns: 1fr;
      }

      .day-card {
        border-color: #cbd5e1;
        box-shadow: none;
        break-inside: auto;
        page-break-inside: auto;
      }

      .day-header,
      .meal-section h3 {
        break-after: avoid-page;
        page-break-after: avoid;
      }

      .meal-instructions-btn {
        display: none !important;
      }

      .meal-block {
        background: #ffffff;
        border-color: #cbd5e1;
      }

      .meal-section {
        break-inside: auto;
        page-break-inside: auto;
      }

      .ingredient-entry {
        background: #ffffff;
      }
    }
  </style>
</head>
<body>
  <h1>What To Cook</h1>
  <p class="page-description">All of your cooking and prep for the chosen dates, grouped by day so the entire plan fits cleanly on a page.</p>
  <div class="controls">
    <label>Start
      <input type="date" id="startDate">
    </label>
    <label>Days
      <input type="number" id="numDays" value="7" min="1" max="365">
    </label>
    <div class="button-row">
      <button id="showBtn">Show</button>
      <button id="printBtn">Print Plan</button>
      <button id="eatViewBtn">What To Eat When</button>
    </div>
  </div>
  <div id="planList" class="plan-grid" aria-live="polite"></div>
  <script type="module" src="whatToCookWhen.js"></script>
</body>
</html>
