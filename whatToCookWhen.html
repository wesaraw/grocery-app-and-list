<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>What To Cook</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      width: 420px;
      margin: 0 auto;
      padding: 10px 14px 20px;
      box-sizing: border-box;
    }

    h1 {
      margin: 0 0 10px;
    }

    .controls {
      display: flex;
      flex-wrap: wrap;
      gap: 8px 12px;
      align-items: flex-end;
    }

    .controls label {
      display: flex;
      flex-direction: column;
      font-size: 0.9rem;
      gap: 4px;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 14px;
    }

    th,
    td {
      padding: 6px;
      border-bottom: 1px solid #ccc;
      vertical-align: top;
    }

    th {
      text-align: left;
      background-color: #f5f5f5;
    }

    .meal-block {
      margin-bottom: 12px;
      padding-bottom: 8px;
      border-bottom: 1px dashed #e0e0e0;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .meal-block:last-child {
      border-bottom: none;
      padding-bottom: 0;
      margin-bottom: 0;
    }

    .meal-title {
      font-weight: 600;
      margin-bottom: 2px;
      color: #111827;
    }

    .leftover-detail {
      font-size: 0.85rem;
      color: #4b5563;
    }

    .ingredient-list {
      margin: 4px 0 0;
      padding: 0;
      list-style: none;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .ingredient-entry {
      background: #f8fafc;
      border: 1px solid #e2e8f0;
      border-radius: 6px;
      padding: 6px 8px;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .ingredient-header {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      gap: 12px;
      flex-wrap: wrap;
    }

    .ingredient-name {
      font-weight: 600;
      color: #1f2937;
    }

    .ingredient-amount {
      font-weight: 500;
      color: #0f172a;
      font-variant-numeric: tabular-nums;
      text-align: right;
    }

    .user-breakdown {
      margin: 0;
      padding: 0;
      list-style: none;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .user-breakdown-item {
      display: flex;
      justify-content: space-between;
      gap: 10px;
      font-size: 0.85rem;
      color: #334155;
    }

    .user-name {
      font-weight: 500;
    }

    .user-amount {
      font-variant-numeric: tabular-nums;
      text-align: right;
    }

    .no-ingredients {
      font-size: 0.85rem;
      color: #666;
    }
  </style>
</head>
<body>
  <h1>What To Cook</h1>
  <div class="controls">
    <label>Start
      <input type="date" id="startDate">
    </label>
    <label>Days
      <input type="number" id="numDays" value="7" min="1" max="365">
    </label>
    <button id="showBtn">Show</button>
    <button id="eatViewBtn">What To Eat When</button>
  </div>
  <table>
    <thead>
      <tr>
        <th>Date</th>
        <th>Cook Today</th>
        <th>Prep Ahead</th>
      </tr>
    </thead>
    <tbody id="cookBody"></tbody>
  </table>
  <script type="module" src="whatToCookWhen.js"></script>
</body>
</html>
