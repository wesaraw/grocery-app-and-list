<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>What To Cook</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      max-width: 1080px;
      margin: 0 auto;
      padding: 18px 28px 36px;
      box-sizing: border-box;
      color: #111827;
      background: #ffffff;
    }

    h1 {
      margin: 0 0 10px;
    }

    .controls {
      display: flex;
      flex-wrap: wrap;
      gap: 8px 12px;
      align-items: flex-end;
    }

    .controls label {
      display: flex;
      flex-direction: column;
      font-size: 0.9rem;
      gap: 4px;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 16px;
      table-layout: fixed;
    }

    tbody tr {
      page-break-inside: avoid;
    }

    th,
    td {
      padding: 6px;
      border-bottom: 1px solid #ccc;
      vertical-align: top;
    }

    th:nth-child(1),
    td:nth-child(1) {
      width: 170px;
    }

    th {
      text-align: left;
      background-color: #f5f5f5;
    }

    .meal-cell {
      padding: 8px 6px 12px;
    }

    .meal-column {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 14px;
      align-items: stretch;
    }

    .meal-block {
      background: #f8fafc;
      border: 1px solid #dbe4f1;
      border-radius: 8px;
      padding: 10px 12px;
      display: flex;
      flex-direction: column;
      gap: 8px;
      height: 100%;
    }

    .meal-block-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
    }

    .meal-title {
      font-weight: 600;
      margin-bottom: 2px;
      color: #111827;
    }

    .meal-instructions-btn {
      font-size: 0.75rem;
      padding: 4px 8px;
      border-radius: 4px;
      border: 1px solid #cbd5f5;
      background: #e0e7ff;
      color: #1e3a8a;
      cursor: pointer;
    }

    .meal-instructions-btn:hover {
      background: #c7d2fe;
    }

    .meal-instructions-btn--empty {
      font-style: italic;
      opacity: 0.85;
    }

    .leftover-detail {
      font-size: 0.85rem;
      color: #4b5563;
    }

    .meal-part-label {
      font-size: 0.85rem;
      font-weight: 600;
      color: #1f2937;
    }

    .ingredient-list {
      margin: 4px 0 0;
      padding: 0;
      list-style: none;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .ingredient-entry {
      background: #ffffff;
      border: 1px solid #e2e8f0;
      border-radius: 6px;
      padding: 6px 8px;
      display: flex;
      flex-direction: column;
      gap: 6px;
      break-inside: avoid;
      page-break-inside: avoid;
    }

    .ingredient-header {
      display: flex;
      align-items: baseline;
      gap: 6px;
      row-gap: 4px;
      flex-wrap: wrap;
    }

    .ingredient-name {
      font-weight: 600;
      color: #1f2937;
    }

    .ingredient-amount {
      font-weight: 500;
      color: #0f172a;
      font-variant-numeric: tabular-nums;
    }

    .user-breakdown {
      margin: 0;
      padding: 0;
      list-style: none;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .user-breakdown-item {
      display: flex;
      align-items: baseline;
      justify-content: flex-start;
      gap: 6px;
      row-gap: 2px;
      font-size: 0.85rem;
      color: #334155;
      flex-wrap: wrap;
    }

    .user-name {
      font-weight: 500;
    }

    .user-amount {
      font-variant-numeric: tabular-nums;
      text-align: right;
    }

    .no-ingredients {
      font-size: 0.85rem;
      color: #666;
    }

    #printPages {
      display: none;
    }

    .print-stack {
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .print-card {
      background: #ffffff;
      border: 1px solid #cbd5e1;
      border-radius: 12px;
      padding: 14px 16px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      page-break-inside: avoid;
      break-inside: avoid-page;
      width: 100%;
      box-sizing: border-box;
      height: 100%;
    }

    .print-card-header {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .print-meta {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 8px 12px;
      color: #0f172a;
      font-size: 0.95rem;
    }

    .print-card-date {
      font-weight: 700;
      letter-spacing: 0.01em;
    }

    .print-card-section {
      font-weight: 700;
      letter-spacing: 0.02em;
      text-transform: uppercase;
      padding: 4px 10px;
      border-radius: 999px;
      border: 1px solid transparent;
    }

    .print-card-section--cook {
      background: #ecfdf3;
      color: #166534;
      border-color: #bbf7d0;
    }

    .print-card-section--prep {
      background: #eff6ff;
      color: #1d4ed8;
      border-color: #bfdbfe;
    }

    .print-card-title {
      font-size: 1.05rem;
      font-weight: 700;
      color: #0b1324;
    }

    .print-card-subtitle {
      display: flex;
      flex-wrap: wrap;
      gap: 6px 10px;
      color: #475569;
      font-size: 0.9rem;
    }

    .print-card-body {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .print-ingredient-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 10px 12px;
    }

    .print-ingredient-grid .ingredient-entry {
      height: 100%;
      box-sizing: border-box;
    }

    .print-footer {
      display: flex;
      flex-wrap: wrap;
      gap: 8px 12px;
      font-size: 0.9rem;
      color: #475569;
    }

    .print-tag {
      padding: 3px 10px;
      border-radius: 10px;
      border: 1px solid #e2e8f0;
      background: #f8fafc;
      font-weight: 600;
      color: #0f172a;
      text-transform: uppercase;
      letter-spacing: 0.02em;
    }

    @page {
      size: 8.5in 11in;
      margin: 0.5in;
    }

    @media print {
      body {
        max-width: none;
        padding: 18px 24px;
      }

      .controls,
      table {
        display: none !important;
      }

      #printBtn {
        display: none !important;
      }

      #printPages {
        display: block;
        margin: 0;
      }

      .meal-block {
        background: #ffffff;
        border-color: #cbd5e1;
      }

      .ingredient-entry {
        background: #ffffff;
      }
    }
  </style>
</head>
<body>
  <h1>What To Cook</h1>
  <div class="controls">
    <label>Start
      <input type="date" id="startDate">
    </label>
    <label>Days
      <input type="number" id="numDays" value="7" min="1" max="365">
    </label>
    <button id="showBtn">Show</button>
    <button id="printBtn">Print Plan</button>
    <button id="eatViewBtn">What To Eat When</button>
  </div>
  <table>
    <thead>
      <tr>
        <th>Date</th>
        <th>Cook Today</th>
        <th>Prep Ahead</th>
      </tr>
    </thead>
    <tbody id="cookBody"></tbody>
  </table>
  <div id="printPages" aria-hidden="true"></div>
  <script type="module" src="whatToCookWhen.js"></script>
</body>
</html>
