<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>What To Eat Calendar</title>
  <style>
    body { font-family: Arial, sans-serif; width: 350px; }
    table { width: 100%; border-collapse: collapse; margin-top: 10px; }
    th, td { padding: 4px; border-bottom: 1px solid #ccc; vertical-align: top; }
    .meal-img {
      width: 50px;
      height: 50px;
      object-fit: contain;
      background: #ccc;
      display: block;
      margin-top: 2px;
    }
    .hidden { display: none; }
  </style>
</head>
<body>
  <h1>What To Eat</h1>
  <div>
    <label>User:
      <select id="userSelect"></select>
    </label>
    <label>Start:
      <input type="date" id="startDate">
    </label>
    <label>Days:
      <input type="number" id="numDays" value="7" min="1" max="365">
    </label>
    <button id="showBtn">Show</button>
    <button id="cookViewBtn">What To Cook When</button>
  </div>
  <table>
    <thead id="tableHead"></thead>
    <tbody id="calendarBody"></tbody>
  </table>
  <button id="reorderBtn">Reorder Columns</button>
  <button id="saveOrderBtn" class="hidden">Save Order</button>
  <script type="module" src="whatToEatCalendar.js"></script>
</body>
</html>
