<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>What To Eat Calendar</title>
  <style>
    body { font-family: Arial, sans-serif; width: 360px; }
    table { width: 100%; border-collapse: collapse; margin-top: 10px; }
    th, td { padding: 4px; border-bottom: 1px solid #ccc; vertical-align: top; }
    .meal-img {
      width: 50px;
      height: 50px;
      object-fit: contain;
      background: #ccc;
      display: block;
      margin-top: 2px;
    }
    .hidden { display: none; }
    .meal-label {
      display: flex;
      flex-direction: column;
      gap: 2px;
      font-size: 0.9rem;
    }
    .nutrient-points {
      align-self: flex-start;
      background: #eef3ff;
      border-radius: 4px;
      color: #1a3d7c;
      font-size: 0.7rem;
      font-weight: 600;
      padding: 1px 6px;
    }
    .nutrient-toggle {
      display: inline-block;
      margin-top: 4px;
      padding: 2px 6px;
      font-size: 0.7rem;
    }
    .nutrient-breakdown-row td {
      background: #f7f9fc;
    }
    .nutrient-breakdown {
      display: flex;
      flex-wrap: wrap;
      gap: 4px 12px;
      font-size: 0.78rem;
      line-height: 1.4;
    }
    .nutrient-line {
      min-width: 140px;
    }
    .nutrient-label {
      font-weight: 600;
    }
  </style>
</head>
<body>
  <h1>What To Eat</h1>
  <div>
    <label>User:
      <select id="userSelect"></select>
    </label>
    <label>Start:
      <input type="date" id="startDate">
    </label>
    <label>Days:
      <input type="number" id="numDays" value="7" min="1" max="365">
    </label>
    <button id="showBtn">Show</button>
    <button id="cookViewBtn">What To Cook When</button>
  </div>
  <table>
    <thead id="tableHead"></thead>
    <tbody id="calendarBody"></tbody>
  </table>
  <button id="reorderBtn">Reorder Columns</button>
  <button id="saveOrderBtn" class="hidden">Save Order</button>
  <script type="module" src="whatToEatCalendar.js"></script>
</body>
</html>
