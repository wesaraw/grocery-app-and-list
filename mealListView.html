<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Meal List</title>
  <style>
      body { font-family: Arial, sans-serif; }
      table { width: 100%; border-collapse: collapse; }
      th, td { border: 1px solid #ccc; padding: 4px; font-size: 12px; vertical-align: top; }
      .meal-img {
        width: 160px;
        height: 160px;
        object-fit: contain;
        background: #ccc;
        margin-right: 4px;
        vertical-align: middle;
      }
      .portion-input {
        width: 52px;
        margin-left: 4px;
        padding: 2px;
        font-size: 11px;
      }
      .use-cell-content {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
        gap: 4px 8px;
        align-items: center;
      }
      .use-cell-content label {
        display: inline-flex;
        align-items: center;
        gap: 4px;
      }
      th:nth-child(3), td:nth-child(3) { width: 200px; }
      th.book-header {
        border-top: 1px solid #ccc;
        text-align: left;
        position: sticky;
        background: #fff;
        z-index: 1;
        cursor: pointer;
      }
      tr.focused-meal td,
      tr.focused-meal th {
        background-color: #fff4b2;
        transition: background-color 0.6s ease;
      }
  </style>
</head>
<body>
  <h1 id="title"></h1>
  <button id="addMeal">Add Meal</button>
  <button id="removeMeal">Remove Meal</button>
  <button id="repairMealIds">Correct meal id errors</button>
  <table>
    <thead>
      <tr>
        <th>Use</th>
        <th>Image</th>
        <th>Meal</th>
        <th>Prep</th>
        <th>Leftovers</th>
        <th>Weight</th>
        <th>Group</th>
        <th>Ingredient</th>
        <th>Amount</th>
        <th>Cost</th>
        <th>Total</th>
        <th></th>
      </tr>
    </thead>
    <tbody id="mealBody"></tbody>
  </table>
  <script type="module" src="mealListView.js"></script>
</body>
</html>
