<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <link rel="stylesheet" href="styles/windowBase.css">
  <title>Unit of Measure Change</title>
  <style>

    table { width: 100%; border-collapse: collapse; }
    td, th { padding: 4px; border-bottom: 1px solid #ccc; }
    input[type="text"] { width: 60px; }
    .hidden { display: none; }
    .category-header {
      border-top: 1px solid #ccc;
      text-align: left;
      cursor: pointer;
    }
    .item-name-toggle {
      background: none;
      border: none;
      padding: 0;
      font: inherit;
      color: #0066cc;
      cursor: pointer;
      text-align: left;
    }
    .item-name-toggle::after {
      content: ' ▸';
      font-size: 0.8em;
      color: #555;
    }
    .item-name-toggle[aria-expanded="true"]::after {
      content: ' ▾';
    }
    .usage-row td {
      background: #f9f9f9;
    }
    .usage-list {
      list-style: none;
      margin: 4px 0 0 16px;
      padding: 0;
    }
    .usage-list li {
      margin: 4px 0;
    }
    .usage-link {
      background: none;
      border: none;
      padding: 0;
      font: inherit;
      color: #0066cc;
      text-decoration: underline;
      cursor: pointer;
    }
    .no-usage {
      margin: 4px 0 0 16px;
      color: #666;
      font-style: italic;
    }
  </style>
</head>
<body>
  <h1>Unit of Measure Change</h1>
  <label>Search: <input id="searchBox" type="text" placeholder="Search"></label>
  <table>
    <thead>
      <tr>
        <th>Item</th>
        <th>Home UOM</th>
        <th>New UOM</th>
        <th>Treat as Whole</th>
        <th>Change</th>
        <th>Save</th>
      </tr>
    </thead>
    <tbody id="uom-list"></tbody>
  </table>
  <script type="module" src="uomChange.js"></script>
</body>
</html>
