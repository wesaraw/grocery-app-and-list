<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Merge Similar Items</title>
  <style>
    :root {
      color-scheme: light dark;
      font-family: Arial, sans-serif;
    }
    body {
      margin: 0;
      padding: 16px;
      font-size: 14px;
      background: #f7f7f7;
    }
    header {
      margin-bottom: 12px;
    }
    #merge-controls {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      margin-bottom: 16px;
      align-items: center;
    }
    #merge-controls input[type='text'] {
      min-width: 220px;
    }
    #status {
      margin-bottom: 12px;
    }
    #batch-container {
      border: 1px solid #d0d0d0;
      border-radius: 6px;
      padding: 12px;
      min-height: 200px;
      background: #fff;
    }
    .placeholder {
      color: #666;
      font-style: italic;
    }
    .reason-box {
      border-left: 4px solid #1976d2;
      padding-left: 8px;
      margin-bottom: 12px;
    }
    .reason-box h3 {
      margin: 0 0 4px;
      font-size: 14px;
      color: #1976d2;
    }
    .reason-box ul {
      margin: 0;
      padding-left: 16px;
    }
    .batch-table {
      width: 100%;
      border-collapse: collapse;
    }
    .batch-table th,
    .batch-table td {
      border: 1px solid #e0e0e0;
      padding: 8px;
      vertical-align: top;
    }
    .batch-table th {
      background: #fafafa;
      text-align: left;
      font-weight: 600;
    }
    .item-name {
      font-weight: 600;
      font-size: 15px;
    }
    .item-category {
      color: #555;
      font-size: 13px;
    }
    .item-unit,
    .item-store,
    .item-similarity {
      font-size: 12px;
      color: #444;
    }
    .fdc-cell {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }
    .fdc-id {
      font-weight: 600;
    }
    .confidence-badge {
      align-self: flex-start;
      background: #e8f0fe;
      color: #1a73e8;
      border-radius: 12px;
      padding: 2px 8px;
      font-size: 12px;
    }
    .diagnostics {
      display: flex;
      flex-wrap: wrap;
      gap: 4px;
    }
    .diag-badge {
      background: #fff3cd;
      color: #8a6d3b;
      padding: 2px 6px;
      border-radius: 4px;
      font-size: 11px;
    }
    .decision-group {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }
    .decision-option {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 13px;
    }
    #batch-navigation {
      margin-top: 12px;
      display: flex;
      align-items: center;
      gap: 8px;
    }
  </style>
</head>
<body>
  <header>
    <h1>Merge Similar Items</h1>
    <p>
      Scan the inventory for duplicate items, review suggested batches, and choose which
      entries should be merged before committing the changes.
    </p>
  </header>
  <section id="merge-controls">
    <label>
      Search:
      <input type="text" id="searchBox" placeholder="Filter items" />
    </label>
    <button id="rescan">Rescan Inventory</button>
    <button id="apply" disabled>Apply Decisions</button>
    <button id="undo" disabled>Undo Last Merge</button>
  </section>
  <section id="status" class="placeholder" aria-live="polite">Initializing merge review…</section>
  <section id="batch-container" aria-live="polite">
    <p class="placeholder">No batches loaded yet.</p>
  </section>
  <section id="batch-navigation">
    <button id="prevBatch" disabled>Previous Batch</button>
    <span id="batchPosition" class="placeholder">0 / 0</span>
    <button id="nextBatch" disabled>Next Batch</button>
  </section>
  <script type="module" src="mergeItems.js"></script>
</body>
</html>
